optimizer: {type: AdamW, kwargs: {lr: 0.0005, weight_decay: 0.05}}
scheduler: {type: CosLR, kwargs: {epochs: 150, initial_epochs: 10}}
dataset:
  train: {_base_: cfgs/dataset_configs/S3DIS.yaml, others: {subset: train}}
  val: {_base_: cfgs/dataset_configs/S3DIS.yaml, others: {subset: test}}
  test: {_base_: cfgs/dataset_configs/S3DIS.yaml, others: {subset: test, bs: 32}}
model:
  NAME: PointTransformerSeg
  trans_dim: 384
  depth: 12
  drop_path_rate: 0.1
  num_heads: 6
  group_size: 32
  num_group: 512
  encoder_dims: 384
  peft_method: hpe
  peft_bottleneck: 64
  peft_per_layer: true
  freeze_backbone: true
  num_classes: 13
npoints: 2048
num_classes: 13
total_bs: 16
step_per_update: 1
max_epoch: 150
grad_norm_clip: 10
