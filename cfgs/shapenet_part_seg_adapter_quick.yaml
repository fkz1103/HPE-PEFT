optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.0005,
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 150,
    initial_epochs : 10
}}

dataset : {
  train : { _base_: cfgs/dataset_configs/ShapeNetPart.yaml,
            others: {subset: 'train'}},
  val : { _base_: cfgs/dataset_configs/ShapeNetPart.yaml,
            others: {subset: 'val'}},
  test : { _base_: cfgs/dataset_configs/ShapeNetPart.yaml,
            others: {subset: 'test'}}}

model : {
  NAME: PointTransformerSeg,
  trans_dim: 384,
  depth: 12,
  drop_path_rate: 0.1,
  num_heads: 6,
  group_size: 32,
  num_group: 512,
  encoder_dims: 384,
  peft_method: adapter,
  peft_rank: 4,
  peft_bottleneck: 64,
  freeze_backbone: True,
}

npoints: 2048
total_bs : 16
step_per_update : 1
max_epoch : 2
grad_norm_clip : 10
